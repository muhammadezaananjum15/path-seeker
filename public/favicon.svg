<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="psGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#290C86" />
      <stop offset="50%" stop-color="#4F20C9" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#4F20C9" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Shield Container -->
  <rect width="512" height="512" rx="128" fill="url(#psGrad)" />
  
  <!-- Outer Compass Ring -->
  <circle cx="256" cy="256" r="160" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="16" />
  
  <!-- Compass Points -->
  <circle cx="256" cy="76" r="10" fill="#FDE047" />
  <circle cx="436" cy="256" r="10" fill="#FFFFFF" fill-opacity="0.6" />
  <circle cx="256" cy="436" r="10" fill="#FFFFFF" fill-opacity="0.6" />
  <circle cx="76" cy="256" r="10" fill="#FFFFFF" fill-opacity="0.6" />

  <!-- Center Target Star & Compass Pointer -->
  <g filter="url(#shadow)">
    <polygon points="256,120 286,226 392,256 286,286 256,392 226,286 120,256 226,226" fill="url(#starGrad)" />
    <circle cx="256" cy="256" r="32" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="18" fill="#4F20C9" />
  </g>
</svg>